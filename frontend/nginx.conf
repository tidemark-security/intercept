map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

# Consent transaction capabilities live in the URL fragment, which nginx never
# receives. Still prevent the shell HTML itself from entering browser caches.
map $request_uri $sensitive_response_cache_control {
    default "";
    ~^/oauth/mcp/consent(?:\?|$) "no-store";
    ~^/api/v1/mcp/oauth/consent/oidc/?(?:\?|$) "no-store";
    ~^/mcp/consent/?(?:\?|$) "no-store";
}

map $request_uri $sensitive_response_pragma {
    default "";
    ~^/oauth/mcp/consent(?:\?|$) "no-cache";
    ~^/api/v1/mcp/oauth/consent/oidc/?(?:\?|$) "no-cache";
    ~^/mcp/consent/?(?:\?|$) "no-cache";
}

# Use the direct peer unless an operator explicitly configures nginx real_ip
# for a trusted upstream proxy. Arbitrary X-Forwarded-For is never a rate key.
limit_req_zone $binary_remote_addr zone=mcp_registration_per_ip:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=mcp_authorization_per_ip:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=oidc_login_per_ip:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=passkey_ceremony_per_ip:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=password_login_per_ip:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=application_requests_per_ip:10m rate=1200r/m;

server {
    listen 8080;
    server_name _;
    # Resolve Compose service names at request time so the standalone frontend
    # image can serve its SPA even when a backend container is not present.
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $backend_upstream http://backend:8000;
    set $storage_upstream http://minio:9000;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http: https: ws: wss:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin" always;
    add_header Cache-Control $sensitive_response_cache_control always;
    add_header Pragma $sensitive_response_pragma always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location = /api/v1/auth/oidc/login {
        limit_req zone=oidc_login_per_ip burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/v1/auth/oidc/callback {
        limit_req zone=oidc_login_per_ip burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # This public, capability-bearing lookup accepts only one small JSON field.
    location = /api/v1/mcp/oauth/consent/oidc {
        client_max_body_size 4k;
        limit_req zone=application_requests_per_ip burst=400 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering on;
    }

    location = /api/v1/mcp/oauth/consent/oidc/ {
        client_max_body_size 4k;
        limit_req zone=application_requests_per_ip burst=400 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering on;
    }

    location = /api/v1/auth/login {
        client_max_body_size 8k;
        limit_req zone=password_login_per_ip burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering on;
    }

    location = /api/v1/auth/login/ {
        client_max_body_size 8k;
        limit_req zone=password_login_per_ip burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering on;
    }

    # Password mutation bodies are bounded before FastAPI parses JSON. The
    # shared rate zone also limits unauthenticated reset-token guessing.
    location = /api/v1/auth/password/change {
        client_max_body_size 8k;
        limit_req zone=password_login_per_ip burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering on;
    }

    location = /api/v1/auth/password/change/ {
        client_max_body_size 8k;
        limit_req zone=password_login_per_ip burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering on;
    }

    location = /api/v1/auth/reset-password {
        client_max_body_size 8k;
        limit_req zone=password_login_per_ip burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering on;
    }

    location = /api/v1/auth/reset-password/ {
        client_max_body_size 8k;
        limit_req zone=password_login_per_ip burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering on;
    }

    # Passkey ceremonies are buffered and bounded before FastAPI parses JSON.
    # Keep the trailing-slash variants protected before router canonicalization.
    location = /api/v1/auth/passkeys/register/options {
        client_max_body_size 256k;
        limit_req zone=passkey_ceremony_per_ip burst=20 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering on;
    }

    location = /api/v1/auth/passkeys/register/options/ {
        client_max_body_size 256k;
        limit_req zone=passkey_ceremony_per_ip burst=20 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering on;
    }

    location = /api/v1/auth/passkeys/register/verify {
        client_max_body_size 256k;
        limit_req zone=passkey_ceremony_per_ip burst=20 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering on;
    }

    location = /api/v1/auth/passkeys/register/verify/ {
        client_max_body_size 256k;
        limit_req zone=passkey_ceremony_per_ip burst=20 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering on;
    }

    location = /api/v1/auth/passkeys/authenticate/options {
        client_max_body_size 256k;
        limit_req zone=passkey_ceremony_per_ip burst=20 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering on;
    }

    location = /api/v1/auth/passkeys/authenticate/options/ {
        client_max_body_size 256k;
        limit_req zone=passkey_ceremony_per_ip burst=20 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering on;
    }

    location = /api/v1/auth/passkeys/authenticate/verify {
        client_max_body_size 256k;
        limit_req zone=passkey_ceremony_per_ip burst=20 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering on;
    }

    location = /api/v1/auth/passkeys/authenticate/verify/ {
        client_max_body_size 256k;
        limit_req zone=passkey_ceremony_per_ip burst=20 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering on;
    }

    location = /mcp/register {
        client_max_body_size 64k;
        limit_req zone=mcp_registration_per_ip burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering on;
        proxy_buffering off;
    }

    # Apply identical controls before nginx/FastMCP canonicalize a trailing slash.
    location = /mcp/register/ {
        client_max_body_size 64k;
        limit_req zone=mcp_registration_per_ip burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering on;
        proxy_buffering off;
    }

    location = /mcp/authorize {
        client_max_body_size 64k;
        limit_req zone=mcp_authorization_per_ip burst=20 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
    }

    # Apply identical controls before nginx/FastMCP canonicalize a trailing slash.
    location = /mcp/authorize/ {
        client_max_body_size 64k;
        limit_req zone=mcp_authorization_per_ip burst=20 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
    }

    # OAuth form endpoints are public. Buffer and bound them before FastMCP
    # parses application/x-www-form-urlencoded request bodies.
    location = /mcp/consent {
        client_max_body_size 64k;
        limit_req zone=application_requests_per_ip burst=400 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering on;
    }

    location = /mcp/consent/ {
        client_max_body_size 64k;
        limit_req zone=application_requests_per_ip burst=400 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering on;
    }

    location = /mcp/token {
        client_max_body_size 64k;
        limit_req zone=application_requests_per_ip burst=400 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering on;
    }

    location = /mcp/token/ {
        client_max_body_size 64k;
        limit_req zone=application_requests_per_ip burst=400 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering on;
    }

    location = /mcp/revoke {
        client_max_body_size 64k;
        limit_req zone=application_requests_per_ip burst=400 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering on;
    }

    location = /mcp/revoke/ {
        client_max_body_size 64k;
        limit_req zone=application_requests_per_ip burst=400 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering on;
    }

    # Cache hashed assets aggressively (Vite adds content hashes)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Keep the API on the same public origin as the SPA. This includes the
    # browser-facing local MCP consent handoff and the application WebSocket.
    location ^~ /api/ {
        limit_req zone=application_requests_per_ip burst=400 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;

        # MinIO signs the internal host and path. Give browsers a same-origin
        # URL; the /storage/ proxy below restores both before signature checks.
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter "http://minio:9000/" "/storage/";
    }

    # FastMCP Streamable HTTP. Keep buffering off so protocol events are
    # delivered to clients as soon as the backend emits them.
    location ^~ /mcp/ {
        limit_req zone=application_requests_per_ip burst=400 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no always;
    }

    # OAuth discovery must stay on the public origin and must not fall through
    # to the SPA, which would return index.html instead of metadata JSON.
    location ^~ /.well-known/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /storage/ {
        rewrite ^/storage/(.*)$ /$1 break;
        proxy_pass $storage_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback — serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
