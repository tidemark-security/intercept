# =============================================================================
# DEVELOPMENT Docker Compose — for local dev with hot-reload and source mounts.
# Run from this directory:  cd dev && docker compose up -d
#
# WARNING: This configuration is for local development and testing only.
# Do not use in production as it contains weak hardcoded secrets, and lacks 
# proper security measures.
#
# Browser traffic enters through the nginx harness on http://localhost:8080.
# For a tunnel, point the single public hostname at 127.0.0.1:8080 and set
# INTERCEPT_PUBLIC_ORIGIN to its HTTPS origin before starting Compose.
#
# For a single-file quickstart using published images (no repo clone needed),
# see docs/quickstart/docker-compose.yml
# =============================================================================

services:
  postgres:
    build:
      context: ../backend
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_DB: intercept_case_db
      POSTGRES_USER: intercept_user
      POSTGRES_PASSWORD: intercept_password
      LANGFLOW_DB_PASSWORD: langflow_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Kept loopback-only for host-run migrations and backend tests.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ../backend/init-pgcron.sql:/docker-entrypoint-initdb.d/02-init-pgcron.sql
      - ../backend/init-pgvector.sql:/docker-entrypoint-initdb.d/03-init-pgvector.sql
    command: 
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_cron"
      - "-c"
      - "cron.database_name=postgres"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intercept_user -d intercept_case_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    extra_hosts:
      - "localhost:host-gateway"
    expose:
      - "8000"
    environment:
      AUTO_SEED: "true"
      DATABASE_URL: postgresql+asyncpg://intercept_user:intercept_password@postgres:5432/intercept_case_db
      STORAGE_ENDPOINT: minio:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_BUCKET: intercept-attachments
      STORAGE_USE_SSL: "false"
      LANGFLOW__BASE_URL: http://langflow:7860/api/v1
      LANGFLOW__API_KEY: ${LANGFLOW_API_KEY:-dev-langflow-api-key}
      SECRET_KEY: dev-secret-key-change-in-production
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-dev-initial-admin-password}
      CORS_ORIGINS: '["${INTERCEPT_PUBLIC_ORIGIN:-http://localhost:8080}", "http://localhost:8080", "http://127.0.0.1:8080", "http://localhost:5173"]'
      OIDC_ALLOWED_REDIRECT_ORIGINS: '["${INTERCEPT_PUBLIC_ORIGIN:-http://localhost:8080}", "http://localhost:8080", "http://127.0.0.1:8080", "http://localhost:5173"]'
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
      additional_contexts:
        ux: ${UX_CONTEXT:-../../ux}
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      # Use polling so Vite notices rebuilds in bind-mounted sibling repos,
      # especially on Docker Desktop where native file events can be missed.
      VITE_USE_POLLING: "true"
    expose:
      - "5173"
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/index.html:/app/index.html
      - ../frontend/vite.config.ts:/app/vite.config.ts
      - ../frontend/tailwind.config.js:/app/tailwind.config.js
      - ../frontend/postcss.config.js:/app/postcss.config.js
      - ../frontend/tsconfig.json:/app/tsconfig.json
      - ../frontend/tsconfig.node.json:/app/tsconfig.node.json
      # Mount the sibling UX checkout live. The frontend dev image installs
      # @tidemark-security/ux as file:/ux, so this keeps UX rebuilds visible
      # without rebuilding the frontend image. Set UX_CONTEXT if your UX repo
      # is not at ../../ux as resolved from the Intercept project root.
      - ${UX_CONTEXT:-../../ux}:/ux
    depends_on:
      - backend

  minio:
    image: docker.io/minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    expose:
      - "9000"  # API, proxied by nginx at /storage/
      - "9001"  # Console remains internal-only
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: docker.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 minioadmin minioadmin;
      mc mb minio/intercept-attachments --ignore-existing;
      mc anonymous set none minio/intercept-attachments;
      echo 'MinIO bucket initialized successfully';
      exit 0;
      "

  langflow:
    image: docker.io/langflowai/langflow:1.10.1
    user: root
    environment:
      LANGFLOW_DATABASE_URL: postgresql://langflow_user:langflow_password@postgres:5432/langflow
      LANGFLOW_PGVECTOR_DATABASE_URL: postgresql://langflow_user:langflow_password@postgres:5432/langflow_rag
      LANGFLOW_VARIABLES_TO_GET_FROM_ENVIRONMENT: "LANGFLOW_PGVECTOR_DATABASE_URL"
      LANGFLOW_CONFIG_DIR: /app/langflow
      LANGFLOW_AUTO_LOGIN: "false"
      LANGFLOW_SUPERUSER: ${LANGFLOW_SUPERUSER:-admin}
      LANGFLOW_SUPERUSER_PASSWORD: ${LANGFLOW_SUPERUSER_PASSWORD:-admin}
      LANGFLOW_SECRET_KEY: ${LANGFLOW_SECRET_KEY:-3R1HFctPJZ_MDJg-GQe2Z_TaEyZyXQZtbcCR5l8S0E4=}
      LANGFLOW_NEW_USER_IS_ACTIVE: "false"
      LANGFLOW_ENABLE_SUPERUSER_CLI: "false"
      LANGFLOW_API_KEY_SOURCE: env
      LANGFLOW_API_KEY: ${LANGFLOW_API_KEY:-dev-langflow-api-key}
      DO_NOT_TRACK: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPIK_API_KEY: ${OPIK_API_KEY:-}
      OPIK_URL_OVERRIDE: ${OPIK_URL_OVERRIDE:-}
      OPIK_PROJECT_NAME: ${OPIK_PROJECT_NAME:-}
      OPIK_WORKSPACE: ${OPIK_WORKSPACE:-}
    extra_hosts:
      - "localhost:host-gateway"
    expose:
      - "7860"
    volumes:
      - langflow_data:/app/langflow
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    extra_hosts:
      - "localhost:host-gateway"
    expose:
      - "8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://intercept_user:intercept_password@postgres:5432/intercept_case_db
      STORAGE_ENDPOINT: minio:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_BUCKET: intercept-attachments
      STORAGE_USE_SSL: "false"
      SECRET_KEY: dev-secret-key-change-in-production
      SESSION_COOKIE_SECURE: "false"
      LANGFLOW__BASE_URL: http://langflow:7860/api/v1
      LANGFLOW__API_KEY: ${LANGFLOW_API_KEY:-dev-langflow-api-key}
      WORKER_CONCURRENCY: "20"
      HEALTH_PORT: "8001"
      LOG_LEVEL: "INFO"
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "worker.py"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  nginx:
    image: docker.io/nginx:1.29-alpine
    ports:
      - "127.0.0.1:${INTERCEPT_PORT:-8080}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - minio
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  langflow_data:
